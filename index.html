<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Bhavnani Games</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- INTRO -->
    <section id="introScreen" class="screen">
        <div class="introText">
            BHAVNANI GAMES PRESENTS
        </div>
    </section>


    <!-- TITLE -->
    <section id="titleScreen" class="screen hidden">

        <h1>BHAVNANI GAMES</h1>

        <button id="startButton">
            START
        </button>

    </section>


    <!-- MAIN MENU -->
    <section id="mainMenu" class="screen hidden">

        <h1>BHAVNANI CITY</h1>

        <button id="newGameButton">
            NEW GAME
        </button>

        <button id="continueButton">
            CONTINUE
        </button>

        <button id="settingsButton">
            SETTINGS
        </button>

    </section>


    <!-- STORY -->
    <section id="storyScreen" class="screen hidden">

        <h1>BHAVNANI CITY</h1>

        <p>
            Welcome to Bhavnani City.
        </p>

        <p>
            Your story begins here.
        </p>

        <button id="storyContinue">
            CONTINUE
        </button>

    </section>


    <!-- GAME -->
    <section id="gameWorld" class="screen hidden">
    </section>


    <!-- SETTINGS -->
    <section id="settingsScreen" class="screen hidden">

        <h1>SETTINGS</h1>

        <button id="backButton">
            BACK
        </button>

    </section>


    <script type="module" src="./game.js"></script>

</body>

</html>
